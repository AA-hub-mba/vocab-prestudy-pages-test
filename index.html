<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Mobile vocabulary pre-study lesson."><title>Vocabulary Pre-study</title><style>:root{font-family:system-ui,sans-serif;color-scheme:light dark}body{max-width:44rem;margin:auto;padding:1rem;line-height:1.55}.box{border:1px solid #8886;border-radius:1rem;padding:1rem;margin:1rem 0}.meta{background:#8881}.word{font-size:1.35rem;font-weight:700}.pron{opacity:.75}.member{border-left:3px solid #8888;padding:.65rem .75rem;margin:.6rem 0;background:#8881}.tag{opacity:.75;font-size:.9rem}.sense{margin:.55rem 0}button{min-height:2.75rem;padding:.6rem 1rem;border-radius:.7rem;border:1px solid #888;font:inherit;margin:.25rem .35rem .25rem 0}textarea{width:100%;box-sizing:border-box;min-height:5rem;font:inherit}#status{font-weight:600}</style></head><body><main><p>Mobile vocabulary pre-study</p><h1 id="topic">Loading lesson…</h1><p id="lesson-meta"></p><section class="box meta"><b>Content version:</b> <code id="version"></code><br><b>Status:</b> <span id="activation"></span></section><section id="families"></section><section class="box"><h2>Self-checks</h2><ol id="checks"></ol></section><section class="box"><h2>Uncertainty note</h2><label for="u">Write down anything unclear</label><textarea id="u" placeholder="Write down anything unclear"></textarea><br><button id="copy" type="button">Copy structured payload</button><button id="tts" type="button">Read uncertainty note (en-GB)</button><p id="status" role="status" aria-live="polite"></p></section></main><script>const statusEl=document.querySelector('#status');let lesson=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function speak(text){if(!('speechSynthesis'in window)){statusEl.textContent='Speech synthesis unavailable.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';speechSynthesis.speak(u);statusEl.textContent='TTS requested with lang=en-GB.'}function senseHTML(s){const ex=esc(s.example||'');return '<p class="sense"><b>'+esc(s.part_of_speech||'')+':</b> '+esc(s.meaning_en||'')+'<br><b>Example:</b> '+ex+' <button type="button" class="speak sense-speak" data-text="'+ex+'">Play example (en-GB)</button></p>'}function familyHTML(item){const cards=item.member_cards||[];const members=cards.map(m=>'<article class="member"><b>'+esc(m.lemma)+'</b> <span class="tag">'+esc((m.parts_of_speech||[]).join(' / '))+' · '+esc(m.priority)+'</span><p>'+esc(m.meaning_zh_hant||'')+'</p>'+((m.senses_by_pos||[]).map(senseHTML).join(''))+'</article>').join('');const near=(item.near_synonyms||[]).map(x=>esc(x.lemma)+' — '+esc(x.distinction)).join('; ');const example=(cards[0]&&cards[0].senses_by_pos&&cards[0].senses_by_pos[0]&&cards[0].senses_by_pos[0].example)||item.example||'';return '<section class="box"><div class="word">'+esc(item.lemma)+' <span class="pron">'+esc(item.british_pronunciation)+'</span></div><p>'+esc(item.meaning_zh_hant)+'</p><p>'+esc(item.meaning_en)+'</p><p><b>Inflections:</b> '+esc((item.inflections||[]).join(', '))+'</p><p><b>Collocations:</b> '+esc((item.collocations||[]).join('; '))+'</p><h3>Word family members</h3>'+members+'<p><b>Near-synonym notes:</b> '+near+'</p></section>'}fetch('./data/current.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{lesson=data;document.querySelector('#topic').textContent=data.topic;document.querySelector('#lesson-meta').textContent=data.lesson_date+' · '+(data.track||'core')+' · '+data.lesson_id;document.querySelector('#version').textContent=data.content_version;document.querySelector('#activation').textContent=data.activation_status;document.querySelector('#families').innerHTML=(data.vocabulary||[]).map(familyHTML).join('');document.querySelector('#checks').innerHTML=(data.self_checks||[]).map(c=>'<li>'+esc(c.prompt)+'</li>').join('');document.querySelectorAll('.speak').forEach(b=>b.addEventListener('click',()=>speak(b.dataset.text)))}).catch(e=>{statusEl.textContent='Lesson load failed: '+e.message});document.querySelector('#tts').addEventListener('click',()=>{const t=document.querySelector('#u').value.trim();if(!t){statusEl.textContent='Enter an English word or sentence first.';return}speak(t)});document.querySelector('#copy').addEventListener('click',async()=>{const p={schema_version:'prestudy-feedback-v1',page:location.href,content_version:lesson?.content_version??null,lesson_id:lesson?.lesson_id??null,uncertainty:document.querySelector('#u').value,submitted_at:new Date().toISOString()};const t=JSON.stringify(p,null,2);try{await navigator.clipboard.writeText(t);statusEl.textContent='Structured payload copied.'}catch{statusEl.textContent=t}});</script></body></html>
